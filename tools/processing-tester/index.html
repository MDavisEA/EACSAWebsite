<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Processing Tester</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #667085; --line: #d9dee7;
    --accent: #2b6cb0; --accent-ink: #ffffff; --danger: #b42318; --warn: #a15c07; --ok: #1a7f4b;
    --code-bg: #ffffff; --console-bg: #101521; --console-ink: #d6deeb; --stage: #e9ecf1;
    --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --panel: #1a1f29; --ink: #e6e9ef; --muted: #98a2b3; --line: #2b3342;
      --accent: #5aa2ff; --accent-ink: #08111f; --danger: #ff8a80; --warn: #f5b862; --ok: #5bd69a;
      --code-bg: #141821; --console-bg: #0b0e14; --console-ink: #d6deeb; --stage: #0f1218; --chip: #232a38;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  .toolbar {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .grow { flex: 1; }
  button, select, input[type=text] {
    font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .pill { padding: 2px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: 12px; }
  .pill.run { color: var(--ok); } .pill.err { color: var(--danger); }
  label.chk { display: inline-flex; gap: 5px; align-items: center; color: var(--muted); font-size: 13px; }

  main { flex: 1; min-height: 0; display: flex; }
  .col { min-width: 0; display: flex; flex-direction: column; }
  #left { width: 46%; min-width: 320px; }
  #right { flex: 1; min-width: 320px; }
  #divider { width: 6px; cursor: col-resize; background: var(--line); flex: none; }
  #divider:hover { background: var(--accent); }

  .tabs { display: flex; gap: 2px; padding: 6px 8px 0; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab {
    padding: 5px 11px; border: 1px solid var(--line); border-bottom: none; border-radius: 6px 6px 0 0;
    background: var(--chip); color: var(--muted); cursor: pointer; white-space: nowrap; display: flex; gap: 6px; align-items: center;
  }
  .tab.active { background: var(--code-bg); color: var(--ink); font-weight: 600; }
  .tab .x { opacity: .55; } .tab .x:hover { opacity: 1; color: var(--danger); }
  .tab input { width: 110px; padding: 1px 4px; }
  .tabs .add { padding: 4px 10px; border-radius: 6px 6px 0 0; border-bottom: none; }

  #code {
    flex: 1; min-height: 120px; width: 100%; resize: none; border: none; outline: none; padding: 12px 14px;
    background: var(--code-bg); color: var(--ink); tab-size: 2;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; overflow: auto;
  }

  #files { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 12px 10px; max-height: 38%; overflow: auto; }
  #files h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; display: flex; gap: 10px; align-items: center; }
  #drop {
    border: 2px dashed var(--line); border-radius: 8px; padding: 10px; text-align: center; color: var(--muted); font-size: 13px;
  }
  #drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  #drop a { color: var(--accent); cursor: pointer; text-decoration: underline; }
  #fileList { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  #fileList li { display: flex; gap: 8px; align-items: center; padding: 3px 8px; background: var(--chip); border-radius: 6px; font-size: 13px; }
  #fileList .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Menlo, monospace; }
  #fileList .sz { color: var(--muted); font-size: 12px; }
  #fileList .st { font-size: 11px; padding: 1px 7px; border-radius: 999px; }
  .st.used { color: var(--ok); } .st.unused { color: var(--muted); }
  #fileList button { padding: 0 7px; border: none; background: transparent; color: var(--muted); }
  #fileList button:hover { color: var(--danger); }
  #needs { margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
  #needs .need { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); border-radius: 6px; padding: 2px 8px; font-size: 12.5px; font-family: ui-monospace, Menlo, monospace; }

  #stageWrap { flex: 1; min-height: 120px; background: var(--stage); position: relative; overflow: auto; padding: 12px; }
  #stage { position: relative; }
  #frameBox { position: relative; background: #fff; box-shadow: 0 1px 8px rgba(0,0,0,.25); display: none; }
  #frameBox iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; }
  #empty { color: var(--muted); padding: 40px 10px; text-align: center; }
  #hint { position: absolute; right: 14px; bottom: 8px; font-size: 12px; color: var(--muted); pointer-events: none; }

  #consoleHead { display: flex; align-items: center; gap: 10px; padding: 4px 10px; background: var(--panel); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  #consoleHead b { color: var(--ink); }
  #console {
    height: 170px; overflow: auto; background: var(--console-bg); color: var(--console-ink); padding: 6px 10px;
    font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word;
  }
  #console .l-error { color: #ff8a80; } #console .l-warn { color: #f5b862; } #console .l-info { color: #8aa4c8; }
  #console .l-out { color: #d6deeb; }
</style>
</head>
<body>

<main>
  <section class="col" id="left">
    <div class="toolbar">
      <button id="run" class="primary" title="Run (Ctrl/Cmd + Enter)">&#9654; Run</button>
      <button id="stop" disabled>&#9632; Stop</button>
      <span id="status" class="pill">Ready</span>
      <span class="grow"></span>
      <label class="chk"><input type="checkbox" id="fit" checked> Scale to fit</label>
      <button id="zip" title="Download a folder you can open in real Processing. Double-click the first tab to name the sketch.">Download for Processing (.zip)</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Paste your Processing code here, then press Run."></textarea>
    <div id="files">
      <h2>Files <span id="fileTotals" style="text-transform:none;letter-spacing:0"></span></h2>
      <div id="drop">Drop images or other files here, or <a id="pick">choose files</a>
        <input type="file" id="picker" multiple hidden></div>
      <div id="needs"></div>
      <ul id="fileList"></ul>
    </div>
  </section>
  <div id="divider" title="Drag to resize"></div>
  <section class="col" id="right">
    <div id="stageWrap">
      <div id="empty">Press <b>Run</b> to see the sketch here.</div>
      <div id="stage"><div id="frameBox"></div></div>
      <div id="hint">Click the sketch first so it receives keyboard input</div>
    </div>
    <div id="consoleHead"><b>Console</b><span id="counts"></span><span class="grow"></span><button id="clearConsole" style="padding:1px 8px">Clear</button></div>
    <div id="console" role="log" aria-live="polite"></div>
  </section>
</main>

<script src="vendor/processing-src.js"></script>
<script src="javaFixes.js"></script>
<script src="runner.js"></script>
<script src="zip.js"></script>
<script src="app.js"></script>
</body>
</html>
